# ===============================
# Servidor y Aplicacion
# ===============================
spring.application.name=gestify-backend
server.port=${PORT:8080}

# ===============================
# Base de Datos MySQL
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gestify_db?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# Subida de Archivos (Multipart)
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
server.tomcat.max-swallow-size=25MB
server.tomcat.max-http-form-post-size=25MB

# ===============================
# Seguridad y JWT
# ===============================
jwt.secret=${JWT_SECRET:R2VzdGlmeVN1cGVyU2VjcmV0S2V5MjAyNkZvckpXVFRva2Vuc0ludmVudG9yeQ==}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===============================
# Cloudinary (Almacenamiento de Imagenes)
# ===============================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:tu_cloud_name_real}
cloudinary.api-key=${CLOUDINARY_API_KEY:tu_api_key_real}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:tu_api_secret_real}

# ===============================
# Swagger UI / OpenAPI
# ===============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs