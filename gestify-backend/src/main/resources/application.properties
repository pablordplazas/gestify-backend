# ===============================
# Servidor y Aplicacion
# ===============================
spring.application.name=gestify-backend
server.port=${PORT:8080}

# ===============================
# Base de Datos PostgreSQL (Supabase)
# OBLIGATORIO definir en Render (Environment): DB_USER, DB_PASSWORD y JWT_SECRET
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-1-us-east-2.pooler.supabase.com:6543/postgres?prepareThreshold=0&sslmode=require}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

# ===============================
# JSON: ignorar campos desconocidos que envie la app
# ===============================
spring.jackson.deserialization.fail-on-unknown-properties=false

# ===============================
# Subida de Archivos (Multipart)
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
server.tomcat.max-swallow-size=25MB
server.tomcat.max-http-form-post-size=25MB

# ===============================
# Seguridad y JWT
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===============================
# Cloudinary (Almacenamiento de Imagenes)
# ===============================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:tu_cloud_name_real}
cloudinary.api-key=${CLOUDINARY_API_KEY:tu_api_key_real}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:tu_api_secret_real}

# ===============================
# Swagger UI / OpenAPI
# ===============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs